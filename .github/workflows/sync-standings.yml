name: Sync Standings

on:
  schedule:
    # Every 30 minutes during tournament (June 11 – July 19 2026)
    - cron: '*/30 * * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync scores and standings
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="https://pitchguide.vercel.app/api/sync-standings"
          echo "Hitting: $TARGET_URL"
          echo "Auth header set: $([ -n "$CRON_SECRET" ] && echo yes || echo NO - secret missing)"
          RESPONSE=$(curl -sL -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$TARGET_URL")
          echo "$RESPONSE"
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Sync failed with status $HTTP_STATUS"
            exit 1
          fi
